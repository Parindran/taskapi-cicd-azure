apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
  labels:
    app: taskapi
spec:
  # Note: tasks live in an in-memory H2 database inside each pod, so each
  # replica keeps its own task list.
  replicas: 2
  # Roll out one new pod at a time and never drop below 2 ready pods,
  # so an update needs room for at most 3 pods on the node.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Keep old ReplicaSets so earlier versions can be rolled back to.
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: taskapi
  template:
    metadata:
      labels:
        app: taskapi
    spec:
      containers:
        - name: taskapi
          # Replaced with the ACR image by ansible/deploy.yml
          image: taskapi:local
          ports:
            - containerPort: 8081
          resources:
            # Small CPU reservation so several pods fit on the single
            # Standard_D2_v4 node (Azure's system pods already reserve ~1.35 CPU).
            # No CPU limit, so start-up can still use any spare CPU.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Gives the app up to 5 minutes to start before the other probes run,
          # so a slow first boot is not mistaken for a crash.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
