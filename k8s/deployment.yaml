apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
  labels:
    app: taskapi
spec:
  # One replica: tasks live in an in-memory H2 database inside each pod,
  # so more replicas would each show a different task list.
  replicas: 2
  # Keep old ReplicaSets so earlier versions can be rolled back to.
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: taskapi
  template:
    metadata:
      labels:
        app: taskapi
    spec:
      containers:
        - name: taskapi
          # Replaced with the Artifact Registry image by ansible/deploy.yml
          image: taskapi:local
          ports:
            - containerPort: 8081
          resources:
            # 0.5 CPU keeps Spring Boot's start-up time reasonable.
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          # Gives the app up to 5 minutes to start before the other probes run,
          # so a slow first boot is not mistaken for a crash.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 15
