spring.application.name=taskapi
server.port=8081

# In-memory H2 database, recreated on every start
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Shown on the web page and at /api/info - bump this to demo a redeploy
app.version=1.0.0

# Actuator: health endpoint with liveness/readiness groups for Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
