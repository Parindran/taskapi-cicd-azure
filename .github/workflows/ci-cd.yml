
name: TaskAPI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test application
        run: mvn -B clean verify

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name taskapicicdparin

      - name: Build Docker image
        run: |
          docker build \
            -t taskapicicdparin.azurecr.io/taskapi:${{ github.sha }} \
            -t taskapicicdparin.azurecr.io/taskapi:latest .

      - name: Push Docker image to ACR
        run: |
          docker push taskapicicdparin.azurecr.io/taskapi:${{ github.sha }}
          docker push taskapicicdparin.azurecr.io/taskapi:latest
