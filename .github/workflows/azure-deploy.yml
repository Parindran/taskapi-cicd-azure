name: TaskAPI CI/CD (Azure)

# Build + test on every push and PR; on pushes to main also push the image
# to Azure Container Registry and deploy it to AKS with Ansible.
#
# Azure settings are set in `env` below. A repository VARIABLE with the same
# name (Settings > Secrets and variables > Actions > Variables) overrides each.
#
# Repository SECRETS (OpenID Connect login, no password stored):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# The app registration needs the Contributor role on the resource group
# (covers pushing to ACR and getting AKS credentials).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'taskapicicdparin' }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'taskapi-rg' }}
  AKS_CLUSTER: ${{ vars.AKS_CLUSTER || 'taskapi-aks' }}
  IMAGE: ${{ vars.ACR_NAME || 'taskapicicdparin' }}.azurecr.io/taskapi

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker-push:
    name: Docker Build and Push to ACR
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to AKS with Ansible
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect kubectl to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Deploy with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image="$IMAGE:${{ github.sha }}"

      - name: Show pod status and logs (on failure)
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods -l app=taskapi -o wide || true
          echo "::endgroup::"
          echo "::group::Pod details"
          kubectl describe pods -l app=taskapi || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::App logs"
          kubectl logs -l app=taskapi --tail=100 --all-containers || true
          kubectl logs -l app=taskapi --tail=100 --previous || true
          echo "::endgroup::"
