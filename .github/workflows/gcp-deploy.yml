name: TaskAPI CI/CD (Google Cloud)

# Build + test on every push and PR; on pushes to main also push the image
# to Artifact Registry and deploy it to GKE with Ansible.
#
# GCP settings are set in `env` below. A repository VARIABLE with the same
# name (Settings > Secrets and variables > Actions > Variables) overrides each:
#   GCP_PROJECT_ID, GCP_REGION, GAR_REPOSITORY, GKE_CLUSTER,
#   GKE_LOCATION (cluster region or zone, defaults to GCP_REGION)
#
# Repository SECRET:
#   GCP_SA_KEY       JSON key of a service account with roles
#                    Artifact Registry Writer + Kubernetes Engine Developer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'cia2-513606' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'taskapi' }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER || 'taskapi-gke' }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION || vars.GCP_REGION || 'asia-south1' }}
  IMAGE: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID || 'cia2-513606' }}/${{ vars.GAR_REPOSITORY || 'taskapi' }}/taskapi

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker-push:
    name: Docker Build and Push
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to GKE with Ansible
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Connect kubectl to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Deploy with Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image="$IMAGE:${{ github.sha }}"

      - name: Show pod status and logs (on failure)
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods -l app=taskapi -o wide || true
          echo "::endgroup::"
          echo "::group::Pod details"
          kubectl describe pods -l app=taskapi || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl get events --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::App logs"
          kubectl logs -l app=taskapi --tail=100 --all-containers || true
          kubectl logs -l app=taskapi --tail=100 --previous || true
          echo "::endgroup::"
